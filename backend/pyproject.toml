[project]
name = "roadpulse-api"
version = "2.0.0"
requires-python = "==3.11.*"
dependencies = [
    "fastapi[standard]>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "python-multipart>=0.0.20,<1",
    "pydantic>=2.11,<3",
    "numpy>=2.0,<3",
    "opencv-python-headless>=4.10,<5",
    "httpx>=0.28,<1",
    "imageio-ffmpeg>=0.6,<1",
    "ultralytics>=8.3,<9",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.uv]
# Ultralytics normally installs the desktop OpenCV wheel as a transitive
# dependency. The API already uses the headless wheel above, which is the
# correct build for FastAPI Cloud and does not require libGL.so.1.
exclude-dependencies = ["opencv-python"]
